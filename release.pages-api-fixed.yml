name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare AVIF assets
        run: |
          if [ -f "scripts/prepare-avif-assets.mjs" ]; then
            node scripts/prepare-avif-assets.mjs
          elif [ -f "prepare-avif-assets.mjs" ]; then
            node prepare-avif-assets.mjs
          else
            echo "prepare-avif-assets.mjs not found, skipping"
          fi

      - name: Build
        run: npm run build

      - name: Clean Pages output
        run: |
          test -d dist
          touch dist/.nojekyll
          find dist -type l -delete
          echo "Dist size:"
          du -sh dist
          echo "Largest files:"
          find dist -type f -printf '%s %p\n' | sort -nr | head -20

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      pages: write
      id-token: write
      actions: read

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 900000
          error_count: 20
          reporting_interval: 10000
