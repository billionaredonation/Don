name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  NODE_OPTIONS: --max_old_space_size=4096
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://vpzcoczvezsatledfwpx.supabase.co' }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_X_OWfkNSzFxfGYCz6eJ1_g_re7DszbX' }}

jobs:
  build:
    name: Build Vite app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund

      - name: Optimize heavy PNG maps for Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir pillow

          python <<'PY'
          from pathlib import Path
          from PIL import Image
          import os

          MIN_SIZE = 300_000
          COLORS = 160

          for path in Path(".").glob("*.png"):
              if path.stat().st_size < MIN_SIZE:
                  continue

              try:
                  before = path.stat().st_size

                  with Image.open(path) as img:
                      if img.mode in ("RGBA", "LA"):
                          image = img.convert("RGBA")
                          out = image.quantize(
                              colors=COLORS,
                              method=Image.Quantize.FASTOCTREE,
                          )
                      else:
                          image = img.convert("RGB")
                          out = image.quantize(
                              colors=COLORS,
                              method=Image.Quantize.MEDIANCUT,
                          )

                      tmp = path.with_suffix(".optimized.png")
                      out.save(tmp, optimize=True)

                  after = tmp.stat().st_size
                  if after < before:
                      os.replace(tmp, path)
                      print(f"optimized {path}: {before} -> {after}")
                  else:
                      tmp.unlink(missing_ok=True)
                      print(f"kept {path}: optimized copy was not smaller")
              except Exception as error:
                  print(f"skip {path}: {error}")
          PY

      - name: Build project
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${VITE_SUPABASE_URL}" ]; then
            echo "VITE_SUPABASE_URL is empty"
            exit 1
          fi

          if [ -z "${VITE_SUPABASE_PUBLISHABLE_KEY}" ]; then
            echo "VITE_SUPABASE_PUBLISHABLE_KEY is empty"
            exit 1
          fi

          npm run build

      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail

          test -d dist
          test -f dist/index.html

          touch dist/.nojekyll
          cp dist/index.html dist/404.html

          DIST_SIZE_MB="$(du -sm dist | cut -f1)"
          echo "dist size: ${DIST_SIZE_MB} MB"

          if [ "${DIST_SIZE_MB}" -gt 90 ]; then
            echo "dist is too heavy for stable GitHub Pages artifact deploy"
            exit 1
          fi

          if ! grep -R -F "${VITE_SUPABASE_URL}" dist >/dev/null 2>&1; then
            echo "Supabase URL was not injected into the build"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
