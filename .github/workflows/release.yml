name: Build dist to gh-pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-dist-to-gh-pages
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  VITE_SUPABASE_URL: https://vpzcoczvezsatledfwpx.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_X_OWfkNSzFxfGYCz6eJ1_g_re7DszbX

jobs:
  build:
    name: Build optimized Vite dist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        shell: bash
        run: |
          npm install --no-audit --no-fund

      - name: Optimize root PNG assets before build
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir pillow

          python <<'PY'
          from pathlib import Path
          from PIL import Image
          import os

          MIN_SIZE = 300_000
          COLORS = 160

          for path in Path(".").glob("*.png"):
              if path.stat().st_size < MIN_SIZE:
                  continue

              try:
                  with Image.open(path) as img:
                      source_size = path.stat().st_size

                      if img.mode in ("RGBA", "LA"):
                          image = img.convert("RGBA")
                          quantized = image.quantize(
                              colors=COLORS,
                              method=Image.Quantize.FASTOCTREE,
                          )
                      else:
                          image = img.convert("RGB")
                          quantized = image.quantize(
                              colors=COLORS,
                              method=Image.Quantize.MEDIANCUT,
                          )

                      tmp = path.with_suffix(".optimized.png")
                      quantized.save(tmp, optimize=True)

                      if tmp.stat().st_size < source_size:
                          os.replace(tmp, path)
                          print(f"optimized {path}: {source_size} -> {path.stat().st_size}")
                      else:
                          tmp.unlink(missing_ok=True)
                          print(f"kept original {path}: optimized copy was not smaller")
              except Exception as error:
                  print(f"skip {path}: {error}")
          PY

      - name: Build Vite app
        shell: bash
        run: |
          npm run build

      - name: Validate optimized dist
        shell: bash
        run: |
          test -d dist
          test -f dist/index.html

          DIST_SIZE_MB=$(du -sm dist | cut -f1)
          echo "dist size: ${DIST_SIZE_MB} MB"

          if [ "$DIST_SIZE_MB" -gt 80 ]; then
            echo "dist is too heavy for stable GitHub Pages deploy: ${DIST_SIZE_MB} MB"
            exit 1
          fi

          if ! grep -R -F "$VITE_SUPABASE_URL" dist >/dev/null 2>&1; then
            echo "Supabase URL was not injected into Vite build"
            exit 1
          fi

          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Publish dist to gh-pages
        shell: bash
        run: |
          rm -rf /tmp/gh-pages
          mkdir -p /tmp/gh-pages
          cp -R dist/. /tmp/gh-pages/

          cd /tmp/gh-pages
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Deploy optimized dist to GitHub Pages"

          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
