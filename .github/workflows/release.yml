name: Build dist to gh-pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-dist-to-gh-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Vite and publish dist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          npm install --no-audit --no-fund

      - name: Build Vite app
        shell: bash
        run: |
          npm run build

      - name: Prepare dist for GitHub Pages
        shell: bash
        run: |
          test -d dist
          test -f dist/index.html
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Publish dist to gh-pages
        shell: bash
        run: |
          rm -rf /tmp/gh-pages
          mkdir -p /tmp/gh-pages
          cp -R dist/. /tmp/gh-pages/

          cd /tmp/gh-pages
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Deploy dist to GitHub Pages"

          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
