name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Vite App
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug root files
        run: |
          echo "ROOT:"
          pwd
          ls -la

          echo "SVG + PNG:"
          find . -maxdepth 1 -type f \( -iname "*.svg" -o -iname "*.png" \)

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify env
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"

      - name: Build app
        run: npm run build

      - name: Prepare dist assets
        run: |
          mkdir -p dist

          if [ -f "./ua.svg" ]; then
            cp "./ua.svg" "./dist/ua.svg"
          fi

          if [ -f "./UkraineMap.png" ]; then
            cp "./UkraineMap.png" "./dist/UkraineMap.png"
          fi

          cp -f ./*.png dist/ 2>/dev/null || true
          cp -f ./*.svg dist/ 2>/dev/null || true
          cp -f ./*.jpg dist/ 2>/dev/null || true
          cp -f ./*.jpeg dist/ 2>/dev/null || true
          cp -f ./*.webp dist/ 2>/dev/null || true
          cp -f ./*.gif dist/ 2>/dev/null || true
          cp -f ./*.ico dist/ 2>/dev/null || true
          cp -f ./*.avif dist/ 2>/dev/null || true

          touch dist/.nojekyll

          echo "DIST:"
          ls -la dist

          test -f dist/ua.svg
          test -f dist/UkraineMap.png

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
