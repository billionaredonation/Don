name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Vite app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Copy root assets to dist
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          cp -f ./*.png dist/ 2>/dev/null || true
          cp -f ./*.jpg dist/ 2>/dev/null || true
          cp -f ./*.jpeg dist/ 2>/dev/null || true
          cp -f ./*.webp dist/ 2>/dev/null || true
          cp -f ./*.svg dist/ 2>/dev/null || true
          cp -f ./*.ico dist/ 2>/dev/null || true

          echo "DIST files:"
          ls -la dist

          echo "Check required files:"
          ls -la dist/ua.svg
          ls -la dist/UkraineMap.png

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
