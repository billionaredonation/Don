name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Vite app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show repo files before build
        run: |
          echo "ROOT FILES:"
          ls -la
          echo "PNG/SVG FILES:"
          find . -maxdepth 1 -type f \( -iname "*.png" -o -iname "*.svg" \) -print

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build
        run: npm run build

      - name: Copy root assets to dist
        shell: bash
        run: |
          set -e

          mkdir -p dist

          cp -f ./*.png dist/ 2>/dev/null || true
          cp -f ./*.svg dist/ 2>/dev/null || true
          cp -f ./*.jpg dist/ 2>/dev/null || true
          cp -f ./*.jpeg dist/ 2>/dev/null || true
          cp -f ./*.webp dist/ 2>/dev/null || true
          cp -f ./*.gif dist/ 2>/dev/null || true
          cp -f ./*.ico dist/ 2>/dev/null || true
          cp -f ./*.avif dist/ 2>/dev/null || true

          echo "DIST FILES AFTER COPY:"
          ls -la dist

          if [ ! -f dist/ua.svg ]; then
            echo "ERROR: dist/ua.svg not found"
            exit 1
          fi

          if [ ! -f dist/UkraineMap.png ]; then
            echo "ERROR: dist/UkraineMap.png not found"
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
