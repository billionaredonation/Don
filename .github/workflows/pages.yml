name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Vite app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      - name: Build Vite app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Copy required runtime images
        shell: bash
        run: |
          set -euo pipefail

          echo "Copying required image assets into dist..."

          mkdir -p dist

          # Копируем все картинки из корня репозитория.
          # У тебя карты лежат именно в корне:
          # UkraineMap.png, KiyvMap.png, DneprMap.png, ua.svg и т.д.
          find . -maxdepth 1 -type f \
            \( \
              -iname "*.png"  -o \
              -iname "*.svg"  -o \
              -iname "*.jpg"  -o \
              -iname "*.jpeg" -o \
              -iname "*.webp" -o \
              -iname "*.gif"  -o \
              -iname "*.ico" \
            \) \
            -exec cp -f {} dist/ \;

          echo "Checking required map files..."

          test -f dist/ua.svg
          test -f dist/UkraineMap.png

          echo "Images copied:"
          find dist -maxdepth 1 -type f \
            \( \
              -iname "*.png"  -o \
              -iname "*.svg"  -o \
              -iname "*.jpg"  -o \
              -iname "*.jpeg" -o \
              -iname "*.webp" -o \
              -iname "*.gif"  -o \
              -iname "*.ico" \
            \) \
            | sort

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
