name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Vite app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Vite app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Copy runtime assets to dist
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          echo "=== Copy all root image assets ==="

          find . -maxdepth 1 -type f \( \
            -iname "*.png" -o \
            -iname "*.svg" -o \
            -iname "*.jpg" -o \
            -iname "*.jpeg" -o \
            -iname "*.webp" -o \
            -iname "*.gif" -o \
            -iname "*.ico" -o \
            -iname "*.avif" \
          \) -print0 | while IFS= read -r -d '' file; do
            base="$(basename "$file")"
            echo "Copy: $base"
            cp -f "$file" "dist/$base"
          done

          echo "=== Normalize Ukraine SVG aliases ==="

          SVG_SOURCE=""

          for candidate in "ua.svg" "UA.svg" "ua.SVG" "UA.SVG" "ukraine.svg" "Ukraine.svg"; do
            if [ -s "$candidate" ]; then
              SVG_SOURCE="$candidate"
              break
            fi
          done

          if [ -z "$SVG_SOURCE" ]; then
            echo "ERROR: no Ukraine SVG found in repo root"
            echo "Expected one of: ua.svg, UA.svg, ua.SVG, UA.SVG, ukraine.svg, Ukraine.svg"
            exit 1
          fi

          if ! grep -qi "<svg" "$SVG_SOURCE"; then
            echo "ERROR: $SVG_SOURCE does not look like SVG"
            exit 1
          fi

          echo "Using SVG source: $SVG_SOURCE"

          cp -f "$SVG_SOURCE" "dist/ua.svg"
          cp -f "$SVG_SOURCE" "dist/UA.svg"
          cp -f "$SVG_SOURCE" "dist/ua.SVG"
          cp -f "$SVG_SOURCE" "dist/UA.SVG"
          cp -f "$SVG_SOURCE" "dist/ukraine.svg"
          cp -f "$SVG_SOURCE" "dist/Ukraine.svg"

          echo "=== Normalize Ukraine map aliases ==="

          MAP_SOURCE=""

          for candidate in "UkraineMap.png" "ukrainemap.png" "UkraineMap.PNG" "map.png"; do
            if [ -s "$candidate" ]; then
              MAP_SOURCE="$candidate"
              break
            fi
          done

          if [ -z "$MAP_SOURCE" ]; then
            echo "ERROR: UkraineMap.png not found in repo root"
            exit 1
          fi

          echo "Using map source: $MAP_SOURCE"

          cp -f "$MAP_SOURCE" "dist/UkraineMap.png"
          cp -f "$MAP_SOURCE" "dist/ukrainemap.png"

          echo "=== Final validation ==="

          if [ ! -s "dist/ua.svg" ]; then
            echo "ERROR: dist/ua.svg missing"
            exit 1
          fi

          if ! grep -qi "<svg" "dist/ua.svg"; then
            echo "ERROR: dist/ua.svg invalid"
            exit 1
          fi

          if [ ! -s "dist/UkraineMap.png" ]; then
            echo "ERROR: dist/UkraineMap.png missing"
            exit 1
          fi

          echo "=== Dist root files ==="
          find dist -maxdepth 1 -type f | sort

          echo "OK: runtime assets ready"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
