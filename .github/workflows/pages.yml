name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Vite app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      - name: Build Vite app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Copy static assets safely
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Copy static assets safely ==="

          mkdir -p dist

          # 1. Сначала жёстко копируем критичные файлы из корня.
          # Если их нет — деплой должен упасть.
          test -s ua.svg
          test -s UkraineMap.png

          cp -f ua.svg dist/ua.svg
          cp -f UkraineMap.png dist/UkraineMap.png

          # 2. Копируем все картинки и svg с сохранением путей.
          # Это не перетирает корневой dist/ua.svg.
          find . \
            -type f \
            \( \
              -iname "*.png"  -o \
              -iname "*.svg"  -o \
              -iname "*.jpg"  -o \
              -iname "*.jpeg" -o \
              -iname "*.webp" -o \
              -iname "*.gif"  -o \
              -iname "*.ico"  -o \
              -iname "*.avif" \
            \) \
            ! -path "./node_modules/*" \
            ! -path "./dist/*" \
            ! -path "./.git/*" \
            ! -path "./.github/*" \
            -print0 | while IFS= read -r -d '' file; do
              rel="${file#./}"
              dir="$(dirname "$rel")"
              base="$(basename "$file")"

              mkdir -p "dist/$dir"
              cp -f "$file" "dist/$rel"

              # В корень dist кладём только файлы из корня репозитория.
              # Файлы из подпапок не смогут перетереть ua.svg.
              if [ "$dir" = "." ]; then
                cp -f "$file" "dist/$base"
              fi
            done

          # 3. После всего ещё раз восстанавливаем критичные файлы.
          cp -f ua.svg dist/ua.svg
          cp -f UkraineMap.png dist/UkraineMap.png

          echo ""
          echo "=== Validate ua.svg ==="

          if [ ! -s dist/ua.svg ]; then
            echo "ERROR: dist/ua.svg missing"
            exit 1
          fi

          if ! grep -qi "<svg" dist/ua.svg; then
            echo "ERROR: dist/ua.svg is not valid SVG"
            exit 1
          fi

          echo ""
          echo "=== Validate UkraineMap.png ==="

          if [ ! -s dist/UkraineMap.png ]; then
            echo "ERROR: dist/UkraineMap.png missing"
            exit 1
          fi

          echo ""
          echo "=== Loading images in dist root ==="

          find dist -maxdepth 1 -type f \
            \( \
              -iname "loading-*.png"  -o \
              -iname "loading-*.jpg"  -o \
              -iname "loading-*.jpeg" -o \
              -iname "loading-*.webp" -o \
              -iname "loading-*.avif" \
            \) | sort

          echo ""
          echo "OK: static assets copied safely"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
