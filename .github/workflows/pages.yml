name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Vite app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Vite app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Copy runtime assets to dist
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Ensure dist exists ==="
          mkdir -p dist

          echo "=== Copy root image assets ==="
          find . -maxdepth 1 -type f \( \
            -iname "*.png" -o \
            -iname "*.svg" -o \
            -iname "*.jpg" -o \
            -iname "*.jpeg" -o \
            -iname "*.webp" -o \
            -iname "*.gif" -o \
            -iname "*.ico" -o \
            -iname "*.avif" \
          \) -print0 | while IFS= read -r -d '' file; do
            base="$(basename "$file")"
            echo "Copy root asset: $base"
            cp -f "$file" "dist/$base"
          done

          echo "=== Validate critical runtime files ==="

          if [ ! -s "dist/ua.svg" ]; then
            echo "ERROR: dist/ua.svg missing or empty"
            exit 1
          fi

          if ! grep -qi "<svg" "dist/ua.svg"; then
            echo "ERROR: dist/ua.svg is not valid SVG"
            exit 1
          fi

          if [ ! -s "dist/UkraineMap.png" ]; then
            echo "ERROR: dist/UkraineMap.png missing or empty"
            exit 1
          fi

          echo "=== Dist root files ==="
          find dist -maxdepth 1 -type f | sort

          echo "OK: deploy assets ready"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
