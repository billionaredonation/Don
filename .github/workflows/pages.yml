name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Vite app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      - name: Build Vite app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Copy all required static assets
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Copying static assets into dist ==="

          mkdir -p dist

          find . \
            -type f \
            \( \
              -iname "*.png"  -o \
              -iname "*.svg"  -o \
              -iname "*.jpg"  -o \
              -iname "*.jpeg" -o \
              -iname "*.webp" -o \
              -iname "*.gif"  -o \
              -iname "*.ico"  -o \
              -iname "*.avif" \
            \) \
            ! -path "./node_modules/*" \
            ! -path "./dist/*" \
            ! -path "./.git/*" \
            ! -path "./.github/*" \
            -print0 | while IFS= read -r -d '' file; do
              rel="${file#./}"
              dir="$(dirname "$rel")"
              base="$(basename "$file")"

              echo "Copying: $rel"

              mkdir -p "dist/$dir"

              # Копия с сохранением пути.
              cp -f "$file" "dist/$rel"

              # Копия в корень dist.
              # Нужна для путей вида './loading-kyiv-1.png', './ua.svg', './UkraineMap.png'.
              cp -f "$file" "dist/$base"
            done

          echo ""
          echo "=== dist root image files ==="
          find dist -maxdepth 1 -type f \
            \( \
              -iname "*.png"  -o \
              -iname "*.svg"  -o \
              -iname "*.jpg"  -o \
              -iname "*.jpeg" -o \
              -iname "*.webp" -o \
              -iname "*.gif"  -o \
              -iname "*.ico"  -o \
              -iname "*.avif" \
            \) | sort

          echo ""
          echo "=== Checking required base files ==="

          if [ ! -s "dist/ua.svg" ]; then
            echo "ERROR: dist/ua.svg was not copied"
            exit 1
          fi

          if [ ! -s "dist/UkraineMap.png" ]; then
            echo "ERROR: dist/UkraineMap.png was not copied"
            exit 1
          fi

          echo ""
          echo "=== Checking loading images ==="

          loading_count="$(
            find dist -maxdepth 1 -type f \
              \( \
                -iname "loading-*.png"  -o \
                -iname "loading-*.jpg"  -o \
                -iname "loading-*.jpeg" -o \
                -iname "loading-*.webp" -o \
                -iname "loading-*.avif" \
              \) | wc -l | tr -d ' '
          )"

          echo "Found loading images in dist root: $loading_count"

          find dist -maxdepth 1 -type f \
            \( \
              -iname "loading-*.png"  -o \
              -iname "loading-*.jpg"  -o \
              -iname "loading-*.jpeg" -o \
              -iname "loading-*.webp" -o \
              -iname "loading-*.avif" \
            \) | sort

          if [ "$loading_count" -lt 1 ]; then
            echo "ERROR: no loading-* images were copied to dist root"
            exit 1
          fi

          echo "OK: required assets exist"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
