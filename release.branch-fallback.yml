name: Deploy to GitHub Pages Branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare AVIF assets
        run: |
          if [ -f "scripts/prepare-avif-assets.mjs" ]; then
            node scripts/prepare-avif-assets.mjs
          elif [ -f "prepare-avif-assets.mjs" ]; then
            node prepare-avif-assets.mjs
          else
            echo "prepare-avif-assets.mjs not found, skipping"
          fi

      - name: Build
        run: npm run build

      - name: Clean output
        run: |
          test -d dist
          touch dist/.nojekyll
          find dist -type l -delete
          echo "Dist size:"
          du -sh dist
          echo "Largest files:"
          find dist -type f -printf '%s %p\n' | sort -nr | head -20

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
